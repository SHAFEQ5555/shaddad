<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHAFEQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050506; --bg-soft: #0d0d10; --fg: #f5f5f7; --muted: #9a9aa2;
      --accent: #ffffff; --ring: rgba(255,255,255,0.12); --radius: 999px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: "Cairo", system-ui, sans-serif; background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }

    /* ===== Navbar ===== */
    .nav { position: fixed; inset: 0 0 auto 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 22px clamp(20px,5vw,64px); backdrop-filter: blur(8px); background: linear-gradient(to bottom, rgba(5,5,6,0.6), rgba(5,5,6,0)); }
    .brand { font-family: "Dancing Script", cursive; font-size: 34px; font-weight: 700; color: var(--accent); }
    .brand img { height: 40px; width: auto; display: block; }
    .nav-links { display: flex; gap: 34px; font-size: 15px; color: var(--muted); }
    .nav-links a:hover { color: var(--fg); }
    .nav-cta { padding: 10px 22px; border: 1px solid var(--ring); border-radius: var(--radius); font-size: 14px; font-weight: 600; transition: .25s; }
    .nav-cta:hover { background: var(--fg); color: var(--bg); }
    .nav-toggle { display: none; background: none; border: 0; color: var(--fg); font-size: 26px; cursor: pointer; }

    /* ===== SCROLL-DRIVEN CINEMATIC HERO ===== */
    .hero-scroll { position: relative; height: 240vh; }
    .hero { position: sticky; top: 0; height: 100vh; overflow: hidden; isolation: isolate;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            text-align: center; padding: 0 clamp(20px,5vw,64px) clamp(60px,10vh,110px); }

    /* طبقة الصورة (parallax + zoom) */
    .hero__media { position: absolute; inset: -8%; z-index: -3; will-change: transform, filter; }
    .hero__media img {
      width: 100%; height: 100%; object-fit: cover; object-position: 50% 6%;
      /* معالجة ألوان سينمائية */
      filter: contrast(1.08) saturate(0.9) brightness(0.92);
    }

    /* تدرّجات لدمج الصورة بالأسود + مساحة للنص (سينمائي) */
    .hero__grade { position: absolute; inset: 0; z-index: -2; pointer-events: none;
      background:
        linear-gradient(to top, rgba(5,5,6,1) 0%, rgba(5,5,6,0.6) 26%, rgba(5,5,6,0) 55%),
        linear-gradient(to bottom, rgba(5,5,6,0.85) 0%, rgba(5,5,6,0) 30%),
        radial-gradient(120% 90% at 50% 35%, transparent 45%, rgba(5,5,6,0.85) 100%); /* vignette */
      will-change: opacity;
    }
    /* حبيبات فيلم خفيفة */
    .hero__grain { position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0.06; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }
    /* شريط سينمائي (letterbox) يظهر مع السحب */
    .hero__bar { position: absolute; left: 0; right: 0; height: 0; z-index: 5; background: #000; will-change: height; }
    .hero__bar--top { top: 0; }
    .hero__bar--bottom { bottom: 0; }

    .hero__inner { position: relative; z-index: 3; will-change: transform, opacity; max-width: 900px; }
    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; margin-bottom: 26px; border: 1px solid var(--ring); border-radius: var(--radius); font-size: 13px; color: #d8d8de; background: rgba(255,255,255,.05); backdrop-filter: blur(6px); }
    .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,.2); }
    .hero-logo { font-family: "Dancing Script", cursive; font-size: clamp(56px,11vw,140px); font-weight: 700; line-height: .9; margin-bottom: 14px;
      color: #fff; text-shadow: 0 8px 40px rgba(0,0,0,.6); will-change: transform; }
    .hero-logo img { max-width: min(520px,85vw); height: auto; filter: invert(1) drop-shadow(0 8px 30px rgba(0,0,0,.6)); }
    .hero h1 { font-size: clamp(24px,4vw,46px); font-weight: 800; line-height: 1.15; max-width: 20ch; margin: 0 auto 20px; text-shadow: 0 4px 24px rgba(0,0,0,.6); }
    .hero p { font-size: clamp(15px,2.1vw,19px); font-weight: 300; color: #c9c9d2; max-width: 50ch; line-height: 1.7; margin: 0 auto 34px; text-shadow: 0 2px 16px rgba(0,0,0,.5); }
    .hero-actions { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .btn { display: inline-flex; align-items: center; gap: 10px; padding: 15px 30px; border-radius: var(--radius); font-size: 16px; font-weight: 600; transition: .25s; }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--fg); color: var(--bg); }
    .btn-ghost { border: 1px solid rgba(255,255,255,.35); color: var(--fg); backdrop-filter: blur(6px); }
    .btn-ghost:hover { background: rgba(255,255,255,.1); }
    .scroll-hint { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 6; color: #b7b7c0; font-size: 12px; letter-spacing: 2px; animation: bounce 2s infinite; will-change: transform, opacity; }
    @keyframes bounce { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(8px)} }

    /* ===== القسم اللي بعده ===== */
    .section { position: relative; z-index: 2; background: var(--bg-soft); padding: clamp(80px,12vw,160px) clamp(20px,6vw,80px); border-top: 1px solid var(--ring); }
    .section h2 { font-size: clamp(28px,5vw,56px); font-weight: 800; max-width: 20ch; }
    .section p { color: var(--muted); font-weight: 300; max-width: 60ch; margin-top: 20px; font-size: 18px; line-height: 1.8; }
    .reveal { opacity: 0; transform: translateY(40px); transition: opacity .8s ease, transform .8s ease; }
    .reveal.in { opacity: 1; transform: none; }

    @media (max-width:760px){ .nav-links,.nav-cta{display:none} .nav-toggle{display:block} .hero__media img{object-position:50% 4%} }
    @media (prefers-reduced-motion: reduce){ .hero-scroll{height:100vh} .hero__media,.hero__inner,.hero-logo{transform:none!important} .hero__bar{height:0!important} }
  </style>
</head>
<body>

  <header class="nav">
    <a href="#" class="brand">SHAFEQ</a>
    <!-- <a href="#" class="brand"><img src="assets/shafeq-logo.png" alt="SHAFEQ" /></a> -->
    <nav class="nav-links">
      <a href="#work">أعمالي</a><a href="#about">عني</a><a href="#services">خدماتي</a><a href="#contact">تواصل</a>
    </nav>
    <a href="#contact" class="nav-cta">ابدأ مشروعك</a>
    <button class="nav-toggle" aria-label="القائمة">☰</button>
  </header>

  <div class="hero-scroll" id="heroScroll">
    <section class="hero">
      <!-- صورتك: احفظها باسم assets/hero.jpg -->
      <div class="hero__media" id="media">
        <img src="assets/hero.jpg" alt="SHAFEQ" />
      </div>
      <div class="hero__grade" id="grade"></div>
      <div class="hero__grain"></div>
      <div class="hero__bar hero__bar--top" id="barTop"></div>
      <div class="hero__bar hero__bar--bottom" id="barBottom"></div>

      <div class="hero__inner" id="heroInner">
        <span class="badge"><span class="dot"></span> متاح لمشاريع جديدة</span>
        <div class="hero-logo" id="heroLogo">SHAFEQ</div>
        <!-- <div class="hero-logo" id="heroLogo"><img src="assets/shafeq-logo.png" alt="SHAFEQ" /></div> -->
        <h1>مصمم وصانع علامات تجارية</h1>
        <p>أحوّل الأفكار إلى هويّات بصرية وتجارب رقمية أنيقة تترك أثرًا لا يُنسى.</p>
        <div class="hero-actions">
          <a href="#work" class="btn btn-primary">شاهد أعمالي <span>←</span></a>
          <a href="#contact" class="btn btn-ghost">تواصل معي</a>
        </div>
      </div>

      <div class="scroll-hint" id="scrollHint">SCROLL ↓</div>
    </section>
  </div>

  <section class="section" id="work">
    <h2 class="reveal">أعمال أفتخر فيها</h2>
    <p class="reveal">هنا تحط مشاريعك ودراسات الحالة. كل عنصر يظهر بسلاسة عند وصول التمرير إليه.</p>
  </section>

  <script>
    const heroScroll=document.getElementById('heroScroll'),media=document.getElementById('media'),
          grade=document.getElementById('grade'),inner=document.getElementById('heroInner'),
          logo=document.getElementById('heroLogo'),hint=document.getElementById('scrollHint'),
          barTop=document.getElementById('barTop'),barBottom=document.getElementById('barBottom');
    const clamp=(v,a,b)=>Math.min(Math.max(v,a),b), lerp=(a,b,t)=>a+(b-a)*t;
    let ticking=false;
    function onScroll(){ if(!ticking){ requestAnimationFrame(update); ticking=true; } }
    function update(){
      ticking=false;
      const rect=heroScroll.getBoundingClientRect();
      const total=heroScroll.offsetHeight-window.innerHeight;
      const p=clamp(-rect.top/(total||1),0,1);            // 0 → 1 مع السحب للأسفل

      // الصورة: zoom + parallax + تعتيم تدريجي (إحساس سينمائي)
      media.style.transform=`translateY(${lerp(0,-60,p)}px) scale(${lerp(1,1.25,p)})`;
      media.style.filter=`brightness(${lerp(1,0.4,p)})`;

      // التدرّج الأسود يزيد عشان الانتقال للقسم الجاي
      grade.style.opacity=String(lerp(1,1.6,p));

      // الشريط السينمائي (letterbox) ينفتح مع السحب
      const bar=lerp(0,10,clamp(p*1.2,0,1));
      barTop.style.height=bar+'vh'; barBottom.style.height=bar+'vh';

      // النص + الشعار: يطلع ويخف
      logo.style.transform=`translateY(${lerp(0,-40,p)}px) scale(${lerp(1,1.15,p)})`;
      inner.style.opacity=String(lerp(1,0,clamp(p*1.5,0,1)));
      inner.style.transform=`translateY(${lerp(0,-70,p)}px)`;

      hint.style.opacity=String(lerp(1,0,clamp(p*3,0,1)));
    }
    addEventListener('scroll',onScroll,{passive:true}); addEventListener('resize',update); update();

    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.2});
    document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
  </script>
</body>
</html>
